spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/zenitrade?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
app:
  jwt-secret: ${JWT_SECRET:replace-this-with-a-long-random-secret-at-least-32-characters}
  jwt-expiration-ms: 86400000
